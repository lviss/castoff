name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # crates.io occasionally 403s a plain fetch during `nix build`/`nix flake check`
      # (see AGENTS.md); retry a few times before giving up.
      - name: nix flake check
        run: |
          for i in 1 2 3 4 5; do
            nix flake check --print-build-logs && exit 0
            echo "nix flake check failed (attempt $i), retrying..."
            sleep 10
          done
          exit 1
