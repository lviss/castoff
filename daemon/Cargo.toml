[package]
name = "castoff-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TV-box daemon for castoff: drives mpv and exposes an FCast-based control API"

[dependencies]
libmpv2 = "6"
# Raw client-API bindings, for the one thing libmpv2's safe event enum drops:
# `mpv_event_end_file.playlist_entry_id`. The daemon attributes async mpv load
# outcomes to the exact `loadfile` submission they belong to by that id (see
# `daemon/src/player.rs`), which the safe `Event::EndFile` cannot express.
libmpv2-sys = "4"
# `time` is what the per-connection PlaybackUpdate push task needs for its
# roughly-once-a-second tick while playing (see `main.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
libc = "0.2"
# Small synchronous HTTP server for the image upload endpoint (see
# `daemon/src/upload.rs`): FCast's own TCP framing caps a frame at 32 KiB
# (`fcast.rs`), nowhere near enough for a phone photo, so uploads get their
# own tiny local HTTP port instead of a new FCast opcode. Chosen over pulling
# in a full async web framework as a better fit for this crate's existing
# minimal-dependency style; runs on its own thread, independent of the
# tokio runtime the FCast server uses.
tiny_http = "0.12"
# Blocking HTTP client for the Jellyfin Session REST API (`daemon/src/jellyfin.rs`):
# passthrough playback control, now-playing polling and remote-nav dispatch,
# plus discovering the browser engine's DevTools HTTP endpoint (`cdp.rs`).
# Every `Player` method this backs (`pause`/`resume`/`seek`/`set_volume`/the
# new remote-command dispatch) is already a plain synchronous function called
# via `spawn_blocking` from `main.rs`'s async dispatch, so a blocking client
# fits that existing shape directly rather than threading a second, async
# HTTP stack through the daemon -- the same "smallest dependency that fits
# this crate's style" reasoning as `tiny_http` above, just for the client
# side instead of the server side.
ureq = { version = "2", features = ["json"] }
# Blocking Chrome DevTools Protocol client (`daemon/src/cdp.rs`), used only to
# drive the Jellyfin login page already displayed in the browser engine (click
# its Quick Connect button, then read back the token/user/device id its own
# login flow obtained) -- see README's "How Jellyfin control works". Plain
# `tungstenite` (not `tokio-tungstenite`): the CDP session is used from the
# same blocking background thread that waits, possibly for minutes, on a
# human approving the on-screen code, which fits a thread-per-wait model, not
# the async runtime `main.rs`'s FCast server uses for everything else.
tungstenite = "0.24"

[dev-dependencies]
# Only used by `tests/webpage_display.rs`, which decodes the compositor's
# `wlr-screencopy` output (`grim`, a PNG) to assert on real rendered pixels.
png = "0.17"

[[bin]]
name = "castoff-daemon"
path = "src/main.rs"
