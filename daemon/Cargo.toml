[package]
name = "castoff-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TV-box daemon for castoff: drives mpv and exposes an FCast-based control API"

[dependencies]
libmpv2 = "6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
# Only used by `tests/webpage_display.rs`, which decodes the compositor's
# `wlr-screencopy` output (`grim`, a PNG) to assert on real rendered pixels.
png = "0.17"

[[bin]]
name = "castoff-daemon"
path = "src/main.rs"
